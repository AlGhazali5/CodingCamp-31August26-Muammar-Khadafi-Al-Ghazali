<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense &amp; Budget Visualizer</title>
  <link rel="stylesheet" href="css/style.css" />
  <!-- Chart.js from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="app-wrapper">

    <!-- ── Header ── -->
    <header class="app-header">
      <div class="header-left">
        <span class="logo-icon">💰</span>
        <h1 class="app-title">Expense &amp; Budget Visualizer</h1>
      </div>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark/light mode">
        <span class="theme-icon" id="themeIcon">🌙</span>
      </button>
    </header>

    <!-- ── Balance Card ── -->
    <section class="balance-section" aria-label="Total balance">
      <div class="balance-card">
        <p class="balance-label">Total Spent</p>
        <p class="balance-amount" id="totalBalance">Rp 0</p>
      </div>
    </section>

    <!-- ── Spending Limit Banner ── -->
    <div class="limit-banner" id="limitBanner" role="alert" aria-live="polite"></div>

    <!-- ── Main Content ── -->
    <main class="main-content">

      <!-- Left column: form + list -->
      <div class="left-column">

        <!-- Add Transaction Form -->
        <section class="card form-card" aria-labelledby="formHeading">
          <h2 class="section-title" id="formHeading">Add Transaction</h2>
          <form id="transactionForm" novalidate>
            <div class="form-group">
              <label for="itemName">Item Name</label>
              <input
                type="text"
                id="itemName"
                placeholder="e.g. Lunch, Taxi ride…"
                autocomplete="off"
                maxlength="60"
              />
              <span class="field-error" id="nameError" aria-live="polite"></span>
            </div>

            <div class="form-group">
              <label for="itemAmount">Amount (Rp)</label>
              <input
                type="number"
                id="itemAmount"
                placeholder="e.g. 25000"
                min="1"
                step="1"
              />
              <span class="field-error" id="amountError" aria-live="polite"></span>
            </div>

            <div class="form-group">
              <label for="itemCategory">Category</label>
              <select id="itemCategory">
                <option value="">-- Select category --</option>
                <option value="Food">🍔 Food</option>
                <option value="Transport">🚗 Transport</option>
                <option value="Fun">🎉 Fun</option>
              </select>
              <span class="field-error" id="categoryError" aria-live="polite"></span>
            </div>

            <button type="submit" class="btn btn-primary" id="addBtn">
              + Add Expense
            </button>
          </form>
        </section>

        <!-- Spending Limit Control -->
        <section class="card limit-card" aria-labelledby="limitHeading">
          <h2 class="section-title" id="limitHeading">Spending Limit</h2>
          <div class="limit-row">
            <input
              type="number"
              id="limitInput"
              placeholder="Set limit (Rp)"
              min="1"
              step="1"
              aria-label="Set spending limit"
            />
            <button class="btn btn-secondary" id="setLimitBtn">Set</button>
            <button class="btn btn-ghost" id="clearLimitBtn">Clear</button>
          </div>
          <p class="limit-current" id="limitDisplay"></p>
        </section>

        <!-- Transaction List -->
        <section class="card list-card" aria-labelledby="listHeading">
          <div class="list-header">
            <h2 class="section-title" id="listHeading">Transactions</h2>
            <div class="sort-controls">
              <label for="sortSelect" class="sort-label">Sort by</label>
              <select id="sortSelect" aria-label="Sort transactions">
                <option value="default">Date Added</option>
                <option value="amount-asc">Amount ↑</option>
                <option value="amount-desc">Amount ↓</option>
                <option value="category">Category</option>
              </select>
            </div>
          </div>

          <ul class="transaction-list" id="transactionList" aria-label="Transaction list">
            <!-- items injected by JS -->
          </ul>

          <p class="empty-state" id="emptyState">No transactions yet. Add one above!</p>
        </section>
      </div>

      <!-- Right column: chart -->
      <div class="right-column">
        <section class="card chart-card" aria-labelledby="chartHeading">
          <h2 class="section-title" id="chartHeading">Spending by Category</h2>
          <div class="chart-container" id="chartContainer">
            <canvas id="expenseChart" aria-label="Pie chart of spending by category" role="img"></canvas>
          </div>
          <p class="chart-empty" id="chartEmpty">Add transactions to see the chart.</p>
        </section>

        <!-- Category Totals Legend -->
        <section class="card legend-card" aria-labelledby="legendHeading">
          <h2 class="section-title" id="legendHeading">Category Totals</h2>
          <ul class="category-legend" id="categoryLegend" aria-label="Category totals">
            <!-- items injected by JS -->
          </ul>
        </section>
      </div>

    </main>

  </div><!-- /.app-wrapper -->

  <script src="js/app.js"></script>
</body>
</html>
